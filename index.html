<!DOCTYPE html>
<html>
<head>
    <title>Music Preference Classifier</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, select, button { margin: 10px 0; padding: 10px; width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 20px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>🎵 Music Preference Classifier</h1>
    <p>Predict music preferences based on age and gender</p>
    
    <label>Age:</label>
    <input type="number" id="age" min="10" max="100" value="25">
    
    <label>Gender:</label>
    <select id="gender">
        <option value="0">Female</option>
        <option value="1">Male</option>
    </select>
    
    <button onclick="predict()">Predict Music Preference</button>
    
    <div id="result" style="display:none;">
        <h3>Predicted Genre: <span id="prediction"></span></h3>
    </div>

    <script>
        async function predict() {
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({age: age, gender: gender})
            });
            
            const data = await response.json();
            document.getElementById('prediction').textContent = data.prediction;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
